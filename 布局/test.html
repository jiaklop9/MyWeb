<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top and Sidebar Navigation</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .content {
      display: flex;
    }
    .sidebar {
      width: 250px;
      background: #f8f9fa;
      padding: 15px;
    }
    .main-content {
      flex-grow: 1;
      padding: 15px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<!-- Top Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <a class="navbar-brand" href="#">Brand</a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav">
      <li class="nav-item" id="navDashboard">
        <a class="nav-link" href="#">Dashboard</a>
      </li>
      <li class="nav-item" id="navUsers">
        <a class="nav-link" href="#">Users</a>
      </li>
      <li class="nav-item" id="navSettings">
        <a class="nav-link" href="#">Settings</a>
      </li>
      <li class="nav-item" id="navMessages">
        <a class="nav-link" href="#">Messages</a>
      </li>
    </ul>
  </div>
</nav>

<!-- Main Content -->
<div class="content">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <!-- Sidebar content dynamically controlled -->
    <div id="dashboardSidebar" class="hidden">
      <a href="#">Dashboard Overview</a>
      <a href="#">Dashboard Settings</a>
    </div>
    <div id="usersSidebar" class="hidden">
      <a href="#">User List</a>
      <a href="#">Add User</a>
    </div>
    <div id="settingsSidebar" class="hidden">
      <a href="#">General Settings</a>
      <a href="#">Profile Settings</a>
    </div>
    <div id="messagesSidebar" class="hidden">
      <a href="#">Inbox</a>
      <a href="#">Sent</a>
    </div>
  </div>
  
  <!-- Main Content Area -->
  <div class="main-content" id="mainContent">
    <h2>Welcome</h2>
    <p>Click on the navigation items to display or hide relevant content.</p>
  </div>
</div>

<!-- Bootstrap 4 JS and jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>

<script>
  $(document).ready(function() {
    // Function to hide all sidebar sections
    function hideAllSections() {
      $('#dashboardSidebar').addClass('hidden');
      $('#usersSidebar').addClass('hidden');
      $('#settingsSidebar').addClass('hidden');
      $('#messagesSidebar').addClass('hidden');
    }

    // Function to show the selected sidebar section
    function showSidebarSection(sectionId) {
      hideAllSections();
      $(sectionId).removeClass('hidden');
    }

    // Top navbar item click events
    $('#navDashboard').click(function() {
      showSidebarSection('#dashboardSidebar');
      $('#mainContent').html(`
        <h2>Dashboard</h2>
        <p>This is the dashboard area.</p>
      `);
    });

    $('#navUsers').click(function() {
      showSidebarSection('#usersSidebar');
      $('#mainContent').html(`
        <h2>Users</h2>
        <p>Manage users here.</p>
      `);
    });

    $('#navSettings').click(function() {
      showSidebarSection('#settingsSidebar');
      $('#mainContent').html(`
        <h2>Settings</h2>
        <p>Configure settings here.</p>
      `);
    });

    $('#navMessages').click(function() {
      showSidebarSection('#messagesSidebar');
      $('#mainContent').html(`
        <h2>Messages</h2>
        <p>View your messages here.</p>
      `);
    });
  });
</script>

</body>
</html>
