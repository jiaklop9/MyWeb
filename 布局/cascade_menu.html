<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>垂直三级折叠菜单</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    /* 设置导航栏垂直排列 */
    .navbar-nav {
      display: block;
    }

    /* 设置导航项垂直显示 */
    .nav-item {
      position: relative;
    }

    /* 设置二级菜单和三级菜单的隐藏显示 */
    .dropdown-menu.level2,
    .dropdown-menu.level3 {
      display: none;
      position: absolute;
      top: 0;
      left: 100%;
    }

    /* 当鼠标悬停在一级菜单时，显示二级菜单 */
    .nav-item.dropdown:hover > .dropdown-menu.level2,
    .nav-item.dropdown:focus > .dropdown-menu.level2 {
      display: block;
    }

    /* 当鼠标悬停在二级菜单时，显示三级菜单 */
    .dropdown-menu.level2 .dropdown-item.dropdown:hover > .dropdown-menu.level3,
    .dropdown-menu.level2 .dropdown-item.dropdown:focus > .dropdown-menu.level3 {
      display: block;
    }

    /* 设置导航栏宽度 */
    .navbar {
      width: 250px;
    }

    /* 设置页面布局 */
    .container-fluid {
      display: flex;
    }

    /* 设置内容区域 */
    .content {
      margin-left: 250px; /* 避免被侧边栏遮挡 */
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="container-fluid">
    <!-- 左侧垂直导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="#">一级菜单1</a>
          </li>
          <div class="dropdown-divider" role="presentation"></div>
          <li class="nav-item">
            <a class="nav-link" href="#">一级菜单2</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="dropdownMenu1" role="button" data-bs-toggle="dropdown">
              二级菜单
            </a>
            <ul class="dropdown-menu level2">
              <li class="dropdown-item dropdown">
                <a class="dropdown-item" href="#">二级菜单1</a>
                <ul class="dropdown-menu level3">
                  <li><a class="dropdown-item" href="#">三级菜单1</a></li>
                  <li><a class="dropdown-item" href="#">三级菜单2</a></li>
                  <li><a class="dropdown-item" href="#">三级菜单3</a></li>
                </ul>
              </li>
              <li><a class="dropdown-item" href="#">二级菜单2</a></li>
              <li><a class="dropdown-item" href="#">二级菜单3</a></li>
            </ul>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="dropdownMenu2" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              三级菜单
            </a>
            <ul class="dropdown-menu level2">
              <li class="dropdown-item dropdown">
                <a class="dropdown-item" href="#">三级菜单1</a>
                <ul class="dropdown-menu level3">
                  <li><a class="dropdown-item" href="#">四级菜单1</a></li>
                  <li><a class="dropdown-item" href="#">四级菜单2</a></li>
                  <li><a class="dropdown-item" href="#">四级菜单3</a></li>
                </ul>
              </li>
              <li><a class="dropdown-item" href="#">三级菜单2</a></li>
              <li><a class="dropdown-item" href="#">三级菜单3</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </nav>

    <!-- 右侧内容区域 -->
    <div class="content">
      <h1>内容区域</h1>
      <p>这里是页面的主要内容，可以根据需要添加其他内容。</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
